<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#2f492f">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Skyline Reclamation, Inc.">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site}}/assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{root}}assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}assets/css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["LocalBusiness", "GeneralContractor"],
    "@id": "{{site}}/#business",
    "name": "Skyline Reclamation, Inc.",
    "alternateName": "SRI",
    "description": "Native-lands revegetation and reclamation contractor in Fairview, Utah: hydroseeding, BARS Silver-certified drone seeding and herbicide application, mechanical mulching, noxious weed control and erosion control.",
    "url": "{{site}}/",
    "logo": "{{site}}/assets/img/sri-logo.png",
    "image": "{{site}}/assets/img/og-image.png",
    "telephone": "+1-435-427-3900",
    "email": "johnlee@skylinereclamation.com",
    "foundingDate": "1995",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "22950 N 10400 E",
      "addressLocality": "Fairview",
      "addressRegion": "UT",
      "postalCode": "84629",
      "addressCountry": "US"
    },
    "areaServed": [
      { "@type": "State", "name": "Utah" },
      { "@type": "Place", "name": "Intermountain West" }
    ],
    "knowsAbout": ["Hydroseeding", "Drone seeding", "Mine reclamation", "Revegetation", "Erosion control", "SWPPP", "Noxious weed control", "Mechanical mulching", "BARS certified drone operations"]
  }
  </script>
</head>
